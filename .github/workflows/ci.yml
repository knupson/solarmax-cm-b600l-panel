# Runs the test suite on a clean Windows machine.
#
# windows-latest and not ubuntu: this project is Windows end to end -- WMI, PDH,
# ctypes/Win32 for the tray, Tkinter for the editor, and fonts requested from the
# system by family. On Linux it would not even start, and it is not meant to.
#
# The runner has no panel, no LibreHardwareMonitor DLLs and no Gigabyte board with
# GSA1. That is the point: it is exactly the machine of somebody who just cloned
# the repo, and the suite has to pass there. If a test starts depending on one
# particular machine's hardware, this workflow catches it -- which is what happened
# on its very first run.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the newest. Testing only the newest let syntax
        # that does not exist on 3.11 through, and 3.11 is what README,
        # docs/install.md and install.ps1 all promise works.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the daemon-base tag, for the check below

      # daemon/ is the byte-identical rollback path for the whole rewrite. The rule
      # was written in CONTRIBUTING against a commit hash that no longer exists --
      # history was rewritten for publication -- so nobody could actually check it.
      # The tag is the anchor and this step is the enforcement.
      - name: daemon/ is unchanged
        run: git diff --exit-code daemon-base -- daemon/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ffmpeg is OPTIONAL for the project, but two tests assert on the text ffmpeg
      # writes to stderr and have nothing to look at without the binary, so they
      # skip themselves. It is installed here so they actually run in CI.
      # continue-on-error on purpose: if choco fails, those tests skip and the run
      # is still valid. Failing the build over a dependency the project itself
      # declares optional would misrepresent what is needed to use it.
      - name: Install ffmpeg (optional)
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      # The failing test names are emitted as a workflow ERROR as well as printed.
      # Downloading a job's log needs repository admin rights, so on a public repo
      # a plain "Process completed with exit code 1" is all an outside contributor
      # -- or the maintainer, from a script -- can see. An error annotation is
      # public, so the failure is legible without opening the web UI.
      - name: Run the suite
        shell: pwsh
        run: |
          $salida = python -m pytest -q --tb=short 2>&1 | Out-String
          Write-Host $salida
          if ($LASTEXITCODE -ne 0) {
            $fallos = ($salida -split "`n" |
                       Select-String -Pattern '^(FAILED|ERROR)|^E ' |
                       Select-Object -First 15 |
                       ForEach-Object { $_.ToString().Trim() }) -join ' %0A '
            if (-not $fallos) { $fallos = 'pytest failed with no FAILED line; see the log' }
            Write-Host "::error title=pytest ($env:PYTHON_VERSION)::$fallos"
            exit 1
          }
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      # conftest.py kills any test running longer than 60 s and writes every
      # thread's stack here. Without this, a hang in CI is a silent timeout.
      - name: Upload the stack trace if something hung
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-hang
          path: pytest-hang.txt
          if-no-files-found: ignore
