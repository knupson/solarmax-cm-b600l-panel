name: Report a bug
description: Something does not work, draws wrong, or the panel is unresponsive
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The diagnostic output plus, for anything visual, the PNG, are almost
        always enough to understand what happened without a round trip.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Output of --diagnostico
      description: "`python -m vmaxpanel --diagnostico`. It says what is missing and what is optional."
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The exact command, or the steps in the editor or the tray.

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: |
        If it concerns what gets drawn: run `python -m vmaxpanel --save bug.png`
        and drop the PNG here. It does not touch the panel.

  - type: input
    id: hardware
    attributes:
      label: Motherboard and GPU
      description: Sensors depend on these. Both appear in the diagnostic output.
      placeholder: e.g. B550 AORUS ELITE + RTX 4070

  - type: textarea
    id: log
    attributes:
      label: Log
      description: "The file you passed to `--log`, if you were using one."
      render: text
